<title>MyDiet</title>
<style>
:root{
 --bg:#EEF1EC; --card:#FFFFFF; --ink:#14201A; --ink2:#56635C; --line:#DCE2DB; --fill:#E9EDE7; --track:#DCE2DB;
 --ok:#1D6B48; --okbg:#D5EBDD; --no:#B42318; --nobg:#FBE3E0; --warn:#875700; --warnbg:#F6EAD0; --btn:#1D6B48; --bar:#F7F9F6;
 --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
 --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#0E1411; --card:#18201B; --ink:#E8EEEA; --ink2:#A2AEA7; --line:#2A342E; --fill:#222B25; --track:#303B34;
  --ok:#5CC795; --okbg:#1B4130; --no:#FF7A6B; --nobg:#3D1D1A; --warn:#E2B55E; --warnbg:#3A2E14; --btn:#237A52; --bar:#131A16;
 }
}
:root[data-theme="dark"]{
 --bg:#0E1411; --card:#18201B; --ink:#E8EEEA; --ink2:#A2AEA7; --line:#2A342E; --fill:#222B25; --track:#303B34;
 --ok:#5CC795; --okbg:#1B4130; --no:#FF7A6B; --nobg:#3D1D1A; --warn:#E2B55E; --warnbg:#3A2E14; --btn:#237A52; --bar:#131A16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,input,select{touch-action:manipulation}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:2.0rem;line-height:2.375rem;font-weight:700;letter-spacing:.2px}
h2{margin:0;font-size:1.0625rem;line-height:1.375rem;font-weight:600}
h3{margin:0;font-size:0.9375rem;line-height:1.25rem;font-weight:600;color:var(--ink2)}
p{margin:0}
.sub{font-size:0.9375rem;line-height:1.25rem;color:var(--ink2)}
.small{font-size:0.8125rem;line-height:1.125rem;color:var(--ink2)}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font-family:var(--ui);font-size:0.9375rem;cursor:pointer}
.btn{height:50px;border:0;border-radius:14px;background:var(--btn);color:#fff;font-size:1.0625rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.5}
.btn2{height:50px;border:0;border-radius:14px;background:var(--fill);color:var(--ok);font-size:1.0625rem;font-weight:600}
.mini{height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--fill);color:var(--ok);font-weight:600}
input,select,textarea{font-family:var(--ui);font-size:1.0625rem;height:48px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);padding:0 14px;width:100%}
textarea{height:auto;padding:12px 14px;line-height:1.375rem}
label{font-size:0.8125rem;line-height:1.125rem;color:var(--ink2)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:14px;background:var(--fill);align-items:center}
.chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 0 0 12px;border-radius:11px;background:var(--card);font-size:0.9375rem;font-weight:600;white-space:nowrap;max-width:100%}
.chip span.g{font-weight:500;color:var(--ink2)}
.chip button{width:44px;height:44px;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0}
.chips input{background:transparent;flex:1 1 150px;min-width:140px;height:44px;padding:0 8px}
.seg{display:grid;gap:4px;padding:4px;border-radius:13px;background:var(--fill)}
.seg button{height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:500;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.val{display:flex;flex-direction:column;gap:2px}
.val b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:1.375rem;line-height:1.625rem;font-weight:600}
.val span{font-size:0.75rem;line-height:1.0rem;color:var(--ink2)}
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:12px}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .lab{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:0.8125rem;color:var(--ink2)}
.gauge .lab b{font-family:var(--num);font-size:0.9375rem;font-weight:600}
.track{position:relative;height:8px;border-radius:4px;background:var(--track)}
.track i{position:absolute;left:25%;width:50%;top:0;bottom:0;border-radius:4px;background:var(--okbg)}
.track u{position:absolute;top:-3px;left:50%;width:2px;height:14px;margin-left:-1px;background:var(--ink2);border-radius:1px}
.track s{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:8px;border:3px solid var(--card)}
.tag{padding:2px 8px;border-radius:10px;font-size:0.75rem;line-height:1.0rem;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.no{background:var(--nobg);color:var(--no)} .tag.w{background:var(--warnbg);color:var(--warn)}
.big{font-family:var(--num);font-size:1.75rem;line-height:2.0rem;font-weight:700;white-space:nowrap}
.big i{font-style:normal;font-size:1.0rem;font-weight:600;margin-left:3px}
.plus{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.fisso{border:1px solid var(--line);background:transparent}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--line);padding:6px 0}
.item:last-child{border-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;color:var(--ink2);font-size:0.6875rem;font-weight:600;padding:0}
nav button[aria-current="page"]{color:var(--ok)}
svg{flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
.spin{width:18px;height:18px;border-radius:9px;border:2px solid var(--track);border-top-color:var(--ok);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:0.8125rem;line-height:1.125rem;font-weight:600}
.banner.w{background:var(--warnbg);color:var(--warn)} .banner.no{background:var(--nobg);color:var(--no)} .banner.ok{background:var(--okbg);color:var(--ok)}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion: reduce){ .spin{animation:none;border-top-color:var(--ok)} *{transition:none!important} }
body.tastiera nav{display:none}
.sug-btn{min-height:44px}
@media (display-mode: standalone){ body{background:var(--bg)} }
</style>
</head>

function integra(target, disponibili){

async function ridimensiona(file, lato){
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, lato / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, "image/jpeg", 0.9));
}

let ZX = null;
function carica_script(src){
  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("libreria")); document.head.appendChild(s); });
}
async function immagine(file){
  if (window.createImageBitmap) return await createImageBitmap(file);
  const url = URL.createObjectURL(file);
  try { return await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; }); }
  finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
}
function tela(img, scala, ruota, ritaglio){
  const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
  const sx = ritaglio ? 0 : 0, sy = ritaglio ? Math.round(h0 * 0.25) : 0;
  const sw = w0, sh = ritaglio ? Math.round(h0 * 0.5) : h0;
  const w = Math.max(1, Math.round(sw * scala)), h = Math.max(1, Math.round(sh * scala));
  const cv = document.createElement("canvas");
  cv.width = ruota ? h : w; cv.height = ruota ? w : h;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.save();
  if (ruota){ ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate(Math.PI / 2); ctx.translate(-w / 2, -h / 2); }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  ctx.restore();
  return cv;
}
function luminanza(cv){
  const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
  const lum = new Uint8ClampedArray(cv.width * cv.height);
  for (let i = 0, j = 0; j < lum.length; i += 4, j++) lum[j] = (d[i] * 306 + d[i+1] * 601 + d[i+2] * 117 + 512) >> 10;
  return lum;
}
function eanValido(t){
  if (!/^\d{8}$|^\d{12}$|^\d{13}$/.test(t)) return false;
  const c = t.split("").map(Number), v = c.pop();
  let s = 0;
  c.reverse().forEach((n, i) => { s += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - s % 10) % 10 === v;
}
async function leggiCodice(file){
  if (!ZX){ await carica_script("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"); ZX = window.ZXing; }
  if (!ZX || !ZX.MultiFormatReader) throw new Error("libreria");
  const hints = new Map();
  hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [ZX.BarcodeFormat.EAN_13, ZX.BarcodeFormat.EAN_8, ZX.BarcodeFormat.UPC_A, ZX.BarcodeFormat.UPC_E, ZX.BarcodeFormat.CODE_128, ZX.BarcodeFormat.ITF]);
  hints.set(ZX.DecodeHintType.TRY_HARDER, true);
  const lettore = new ZX.MultiFormatReader();
  lettore.setHints(hints);
  const img = await immagine(file);
  const lato = Math.max(img.width || img.naturalWidth, img.height || img.naturalHeight);
  const scale = [Math.min(1, 1600 / lato), Math.min(1, 1000 / lato), 1];
  for (const ritaglio of [false, true])
    for (const ruota of [false, true])
      for (const s of scale){
        let cv;
        try { cv = tela(img, s, ruota, ritaglio); } catch(e){ continue; }
        try {
          const src = new ZX.RGBLuminanceSource(luminanza(cv), cv.width, cv.height);
          const bmp = new ZX.BinaryBitmap(new ZX.HybridBinarizer(src));
          const res = lettore.decode(bmp, hints);
          const t = (res.getText() || "").trim();
          if (t) return t;
        } catch(e){ /* nessun codice in questa variante */ }
        finally { try { lettore.reset(); } catch(e){} }
      }
  throw new Error("nessun codice");
}

async function cercaOFF(ean){
  if (/claude\.ai$/.test(location.hostname)) return null;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 7000);
  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(ean) + ".json?fields=product_name,brands,nutriments", { signal: ctrl.signal });
    if (!r.ok) return null;
    const d = await r.json();
    const p = d && d.product;
    if (!p) return null;
    const n = p.nutriments || {};
    const kcal = +(n["energy-kcal_100g"] != null ? n["energy-kcal_100g"] : (n.energy_100g != null ? n.energy_100g / 4.184 : NaN));
    const pr = +n.proteins_100g, ca = +n.carbohydrates_100g, gr = +n.fat_100g;
    if (![kcal, pr, ca, gr].every(x => isFinite(x))) return null;
    const nome = [p.brands ? String(p.brands).split(",")[0].trim() : "", p.product_name || ""].filter(Boolean).join(" ");
    const val = { nome: nome || ("Prodotto " + ean), ean: ean, k: Math.round(kcal * 10) / 10, p: pr, c: ca, g: gr, fonte: "Open Food Facts" };
    return atwaterOk(val.k, val.p, val.c, val.g) ? val : null;
  } catch(e){ return null; }
  finally { clearTimeout(t); }
}

  fileInput(async file => {

    S.busy = "Cerco i valori del prodotto\u2026"; render();

    formProdotto(trovato || { ean: ean });
  }, true);
}

async function caricaPdf(){
  if (!SAMPLE){ alert("La lettura del PDF richiede Claude, non disponibile in questa vista."); return; }
  const i = el("input", { type:"file", accept:"application/pdf", class:"hide" });
  i.addEventListener("change", async () => {
    const file = i.files && i.files[0]; if (!file) return;
    S.busy = "Leggo il PDF\u2026"; render();
    try {
      if (!window.pdfjsLib){
        await carica_script("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
      const buf = await file.arrayBuffer();
      const doc = await window.pdfjsLib.getDocument({ data: buf }).promise;
      let testo = "";
      for (let n = 1; n <= doc.numPages; n++){
        const pg = await doc.getPage(n);
        const tc = await pg.getTextContent();
        testo += tc.items.map(x => x.str).join(" ") + "\n";
      }
      S.busy = "Interpreto il piano\u2026"; render();
      const schema = "{\"titolo\":string,\"giorni\":[{\"giorno\":string,\"attivita\":string,\"pasti\":[{\"ora\":string,\"voci\":[{\"nome\":string,\"g\":number}]}],\"totali\":[kcal,proteine,carboidrati,grassi]}]}";
      const d = await chiediClaude("Estrai il piano alimentare dal testo qui sotto e restituisci SOLO JSON valido con questo schema: " + schema +
        ". Regole: grammature in grammi (1 ml = 1 g); nessun commento; nomi degli alimenti come nel piano. Testo:\n\n" + testo.slice(0, 30000), { modelTier: "complex" });
      if (!d || !Array.isArray(d.giorni) || !d.giorni.length) throw new Error("schema");
      for (const g of d.giorni){
        if (!Array.isArray(g.pasti)) throw new Error("schema");
        for (const pa of g.pasti) for (const v of pa.voci){
          if (typeof v.nome !== "string" || !isFinite(+v.g) || +v.g <= 0 || +v.g > 2000) throw new Error("valori");
          v.g = Math.round(+v.g);
          const f = cerca(v.nome, 1)[0];
          if (f) { v.crea = f.nome; v.conf = true; }
        }
      }
      d.totali_pdf = d.giorni.map(g => g.totali || null);
      S.busy = ""; S.giorno = 0; S.pasto = 0;
      if (confirm("Trovati " + d.giorni.length + " giorni. Sostituisco il piano attuale?")) await salvaPiano(d);
      render();
    } catch(e){ S.busy = ""; alert("Non sono riuscito a leggere il PDF in modo affidabile. Il piano attuale resta invariato."); render(); }
  });
  document.body.appendChild(i); i.click(); setTimeout(() => i.remove(), 120000);
}
